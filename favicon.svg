<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4424" />
      <stop offset="100%" stop-color="#4a2715" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2d1a10" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Fundo Arredondado Chocolate Nobre -->
  <rect width="128" height="128" rx="32" fill="url(#bg)" stroke="#e09f3e" stroke-width="2.5" />
  
  <!-- Estrela e Troféu Dourado -->
  <g filter="url(#shadow)">
    <!-- Estrela Central -->
    <path d="M 64 22 L 72.8 40.5 L 93 43.2 L 78.2 57.3 L 81.8 77.2 L 64 67.5 L 46.2 77.2 L 49.8 57.3 L 35 43.2 L 55.2 40.5 Z" fill="url(#gold)" />
    <!-- Pedestal / Faixa Base -->
    <rect x="34" y="88" width="60" height="14" rx="7" fill="url(#gold)" />
    <!-- Detalhe da Coroa -->
    <circle cx="64" cy="95" r="3" fill="#ffffff" />
    <circle cx="48" cy="95" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="80" cy="95" r="2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
